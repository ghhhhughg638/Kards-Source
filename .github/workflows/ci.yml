name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload reference UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-ui-checks
          path: test-results/
          if-no-files-found: ignore
      - name: Catalog is up to date
        run: |
          python3 tools/generate-node-catalog.py
          git diff --exit-code docs/catalog.json
