name: Deploy Blueprint Studio to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site (latest version lives at /v1/)
        run: |
          mkdir -p _site/v1
          cp -r docs/. _site/v1/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8" />
              <title>KARDS · Blueprint Studio</title>
              <meta http-equiv="refresh" content="0; url=./v1/" />
              <script>
                location.replace("./v1/" + location.search + location.hash);
              </script>
            </head>
            <body>
              <p>正在跳转到最新版本：<a href="./v1/">./v1/</a></p>
            </body>
          </html>
          HTML
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
