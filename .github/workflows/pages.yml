name: Deploy Blueprint Studio to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site (latest version lives at /v1/)
        run: |
          mkdir -p _site/v1
          cp -r docs/. _site/v1/
          touch _site/.nojekyll
          # Stamp the build so the page can tell whether a newer one has been published
          VERSION="$(jq -r '.[0].version' docs/changelog.json)"
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/; s/__BUILD_VERSION__/${VERSION}/" _site/v1/app.js
          grep -q "${GITHUB_SHA}" _site/v1/app.js
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/" _site/v1/*.html
          # Pin every script, style and data URL to this commit (?v=sha). A browser can then never
          # run a mix of old and new files: each build has its own cache entries.
          (
            cd _site/v1
            sed -i -E "s#\"(\./[A-Za-z0-9_-]+\.(js|json|css))\"#\"\1?v=${GITHUB_SHA}\"#g" *.js
            sed -i "s#\./version\.json?v=${GITHUB_SHA}#./version.json#g" app.js
            sed -i -E "s#(href|src)=\"(\./[A-Za-z0-9_-]+\.(js|css))\"#\1=\"\2?v=${GITHUB_SHA}\"#g" *.html
            grep -q "app.js?v=${GITHUB_SHA}" index.html
            grep -q "content=\"${GITHUB_SHA}\"" index.html
            if grep -nE "from \"\./[^\"?]+\"" *.js; then echo "unstamped import left"; exit 1; fi
          )
          printf '{"sha":"%s","version":"%s","builtAt":"%s"}\n' "${GITHUB_SHA}" "${VERSION}" "$(date -u +%FT%TZ)" > _site/v1/version.json
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8" />
              <title>KARDS · Blueprint Studio</title>
              <meta http-equiv="refresh" content="0; url=./v1/" />
              <script>
                location.replace("./v1/" + location.search + location.hash);
              </script>
            </head>
            <body>
              <p>正在跳转到最新版本：<a href="./v1/">./v1/</a></p>
            </body>
          </html>
          HTML
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
